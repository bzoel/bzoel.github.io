[project]
name = "bzwebsite"
version = "3.0.0"
description = "Zensical-based blog for bzoel.io"
authors = [{ name = "Billy Zoellers", email = "billy.zoellers@mac.com" }]
requires-python = ">=3.13.2"

dependencies = [
    "mkdocs-git-revision-date-localized-plugin>=1.1.0,<2",
    "mkdocs-git-committers-plugin-2>=2.2.2,<3",
    "mkdocs-rss-plugin>=1.5.0,<2",
    "cairosvg>=2.6.0,<3",
    "pillow>=10.4.0",
    "mkdocs-glightbox>=0.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "zensical",
]

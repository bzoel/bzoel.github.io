[project]
site_name = "Network Notes"
site_url = "https://bzoel.io"
site_author = "Billy Zoellers"
site_description = "Reflections of an IT Infrastructure Consultant learning about automation, security, and routing/switching"
copyright = "The opinions expressed on this page are my own views and not those of my employer."
repo_name = "bzoel/bzoel.github.io"
repo_url = "https://github.com/bzoel/bzoel.github.io"
edit_uri = "blob/main/docs/"
extra_css = [
  "stylesheets/extra.css",
]

[project.theme]
features = [
    "content.action.view",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.path",
    "navigation.prune",
    "navigation.indexes",
    "navigation.top",
    "navigation.tracking",
    "toc.follow",
    "search.highlight",
    "content.tooltips",
    "content.code.annotate",
    "content.code.copy",
]
custom_dir = "overrides"
favicon = "assets/favicon.png"

[project.theme.icon]
logo = "fa5/logo"
repo = "fontawesome/brands/github"

[project.theme.icon.admonition]
tip = "fontawesome/regular/lightbulb"
note = "fontawesome/regular/note-sticky"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme="light"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"


# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "blue"
accent = "custom"


# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "light blue"

[project.markdown_extensions]
abbr = {}
attr_list = {}
md_in_html = {}
def_list = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.tabbed.alternate_style = true
pymdownx.snippets.auto_append = "includes/abbreviations.md"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"

[project.plugins.glightbox]
skip_classes = [
    "cert", "hero-avatar"
]

[project.plugins.meta]
enabled = true

[project.plugins.rss]
match_path = "posts/.*"
date_from_meta.as_creation = "date"
categories = [
    "categories",
]

[project.plugins.blog]
blog_dir = "posts"
post_date_format = "full"
post_url_date_format = "yyyy/MM"
categories = false
archive_name = "Post Archive"
post_readtime = true
blog_toc = true

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/billyzoellers"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bzoel"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://twitter.com/bzoel"